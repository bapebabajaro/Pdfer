<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330">
  <rect width="760" height="330" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#111111" stroke="#444444" stroke-width="1.5">
    <text x="380" y="34" text-anchor="middle" font-size="24" font-weight="700" stroke="none">Aggregationstillstånd och egenskaper</text>

    <rect x="50" y="60" width="160" height="50" fill="#cccccc"/>
    <rect x="210" y="60" width="170" height="50" fill="#cccccc"/>
    <rect x="380" y="60" width="180" height="50" fill="#cccccc"/>
    <rect x="560" y="60" width="150" height="50" fill="#cccccc"/>

    <rect x="50" y="110" width="160" height="44" fill="#ffffff"/>
    <rect x="210" y="110" width="170" height="44" fill="#ffffff"/>
    <rect x="380" y="110" width="180" height="44" fill="#ffffff"/>
    <rect x="560" y="110" width="150" height="44" fill="#ffffff"/>

    <rect x="50" y="154" width="160" height="44" fill="#ffffff"/>
    <rect x="210" y="154" width="170" height="44" fill="#ffffff"/>
    <rect x="380" y="154" width="180" height="44" fill="#ffffff"/>
    <rect x="560" y="154" width="150" height="44" fill="#ffffff"/>

    <rect x="50" y="198" width="160" height="44" fill="#ffffff"/>
    <rect x="210" y="198" width="170" height="44" fill="#ffffff"/>
    <rect x="380" y="198" width="180" height="44" fill="#ffffff"/>
    <rect x="560" y="198" width="150" height="44" fill="#ffffff"/>

    <rect x="50" y="242" width="160" height="44" fill="#ffffff"/>
    <rect x="210" y="242" width="170" height="44" fill="#ffffff"/>
    <rect x="380" y="242" width="180" height="44" fill="#ffffff"/>
    <rect x="560" y="242" width="150" height="44" fill="#ffffff"/>

    <g fill="#111111" stroke="none" font-size="18">
      <text x="130" y="92" text-anchor="middle" font-weight="700">egenskap</text>
      <text x="295" y="92" text-anchor="middle" font-weight="700">fast ämne</text>
      <text x="470" y="92" text-anchor="middle" font-weight="700">flytande ämne</text>
      <text x="635" y="92" text-anchor="middle" font-weight="700">gas</text>

      <text x="130" y="138" text-anchor="middle">form</text>
      <text x="295" y="138" text-anchor="middle">fast form</text>
      <text x="470" y="138" text-anchor="middle">behållarens form</text>

      <text x="130" y="182" text-anchor="middle">volym</text>
      <text x="470" y="182" text-anchor="middle">fast volym</text>
      <text x="635" y="182" text-anchor="middle">fyller hela behållaren</text>

      <text x="130" y="226" text-anchor="middle">kan flöda?</text>
      <text x="295" y="226" text-anchor="middle">nej</text>

      <text x="130" y="270" text-anchor="middle">komprimerbar?</text>
      <text x="295" y="270" text-anchor="middle">bara lite</text>
    </g>

    <g fill="none" stroke="#7a7a7a" stroke-width="2" stroke-dasharray="7 6">
      <rect x="575" y="120" width="120" height="24" rx="4"/>
      <rect x="225" y="164" width="140" height="24" rx="4"/>
      <rect x="395" y="208" width="150" height="24" rx="4"/>
      <rect x="575" y="208" width="120" height="24" rx="4"/>
      <rect x="395" y="252" width="150" height="24" rx="4"/>
      <rect x="575" y="252" width="120" height="24" rx="4"/>
    </g>
