<svg xmlns="http://www.w3.org/2000/svg" width="820" height="560" viewBox="0 0 820 560">
  <defs>
    <style>
      .title { font: 700 26px Georgia, 'Times New Roman', serif; fill: #132238; }
      .body { font: 400 16px Arial, Helvetica, sans-serif; fill: #5a6978; }
      .axis { font: 700 20px Arial, Helvetica, sans-serif; fill: #132238; }
      .tick { font: 400 15px Arial, Helvetica, sans-serif; fill: #2d3b49; }
    </style>
  </defs>
  <rect width="820" height="560" fill="#f6f8fb"/>
  <rect x="24" y="24" width="772" height="512" rx="24" fill="#ffffff" stroke="#d8e0ea" stroke-width="2"/>
  <text x="410" y="62" text-anchor="middle" class="title">Temperatur och diffusionstid</text>
  <text x="410" y="88" text-anchor="middle" class="body">En punkt avviker från den tydliga trenden.</text>

  <g stroke="#dde4ec" stroke-width="1">
    <line x1="100" y1="430" x2="720" y2="430"/>
    <line x1="100" y1="360" x2="720" y2="360"/>
    <line x1="100" y1="290" x2="720" y2="290"/>
    <line x1="100" y1="220" x2="720" y2="220"/>
    <line x1="100" y1="150" x2="720" y2="150"/>
    <line x1="100" y1="80" x2="720" y2="80"/>

    <line x1="100" y1="80" x2="100" y2="430"/>
    <line x1="188.6" y1="80" x2="188.6" y2="430"/>
    <line x1="277.1" y1="80" x2="277.1" y2="430"/>
    <line x1="365.7" y1="80" x2="365.7" y2="430"/>
    <line x1="454.3" y1="80" x2="454.3" y2="430"/>
    <line x1="542.9" y1="80" x2="542.9" y2="430"/>
    <line x1="631.4" y1="80" x2="631.4" y2="430"/>
    <line x1="720" y1="80" x2="720" y2="430"/>
  </g>

  <g stroke="#1d1d1d" stroke-width="3">
    <line x1="100" y1="430" x2="735" y2="430"/>
    <line x1="100" y1="445" x2="100" y2="80"/>
  </g>

  <g class="tick">
    <text x="100" y="458" text-anchor="middle">0</text>
    <text x="188.6" y="458" text-anchor="middle">10</text>
    <text x="277.1" y="458" text-anchor="middle">20</text>
    <text x="365.7" y="458" text-anchor="middle">30</text>
    <text x="454.3" y="458" text-anchor="middle">40</text>
    <text x="542.9" y="458" text-anchor="middle">50</text>
    <text x="631.4" y="458" text-anchor="middle">60</text>
    <text x="720" y="458" text-anchor="middle">70</text>

    <text x="86" y="435" text-anchor="end">0</text>
    <text x="86" y="365" text-anchor="end">5</text>
    <text x="86" y="295" text-anchor="end">10</text>
    <text x="86" y="225" text-anchor="end">15</text>
    <text x="86" y="155" text-anchor="end">20</text>
    <text x="86" y="85" text-anchor="end">25</text>
  </g>

  <text x="410" y="506" text-anchor="middle" class="axis">vattentemperatur / °C</text>
  <text x="34" y="262" text-anchor="middle" class="axis" transform="rotate(-90 34 262)">tid / minuter</text>

  <line x1="188.6" y1="94" x2="631.4" y2="374" stroke="#8ea4b7" stroke-width="3" stroke-dasharray="10 10"/>

  <g fill="#1c6ca3" stroke="#134868" stroke-width="2.5">
    <circle cx="188.6" cy="94" r="7"/>
    <circle cx="277.1" cy="108" r="7"/>
    <circle cx="365.7" cy="206" r="7"/>
    <circle cx="454.3" cy="262" r="7"/>
    <circle cx="542.9" cy="318" r="7"/>
    <circle cx="631.4" cy="374" r="7"/>
  </g>

  <line x1="307" y1="118" x2="347" y2="98" stroke="#444" stroke-width="2"/>
  <polygon points="347,98 337,97 340,106" fill="#444"/>
  <text x="354" y="100" class="body">avvikande punkt</text>
</svg>
