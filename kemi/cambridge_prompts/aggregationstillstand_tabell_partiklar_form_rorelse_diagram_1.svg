<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430">
  <defs>
    <style>
      .title { font: 700 28px Georgia, 'Times New Roman', serif; fill: #132238; }
      .head { font: 700 17px Arial, Helvetica, sans-serif; fill: #173149; }
      .cell { font: 400 17px Arial, Helvetica, sans-serif; fill: #243648; }
      .hint { font: italic 14px Georgia, 'Times New Roman', serif; fill: #6b7a88; }
    </style>
  </defs>
  <rect width="1100" height="430" fill="#f6f8fb"/>
  <rect x="24" y="24" width="1052" height="382" rx="24" fill="#ffffff" stroke="#d8e0ea" stroke-width="2"/>
  <text x="550" y="68" text-anchor="middle" class="title">Egenskaper hos fasta ämnen, vätskor och gaser</text>

  <g transform="translate(34 118)">
    <rect x="0" y="0" width="170" height="62" rx="14" fill="#dfe8f3" stroke="#c1cfdf"/>
    <rect x="170" y="0" width="220" height="62" rx="14" fill="#e9f1f8" stroke="#c9d8e7"/>
    <rect x="390" y="0" width="240" height="62" rx="14" fill="#eef4db" stroke="#d7e4b1"/>
    <rect x="630" y="0" width="230" height="62" rx="14" fill="#f7ead8" stroke="#ead1aa"/>
    <rect x="860" y="0" width="190" height="62" rx="14" fill="#e6eef9" stroke="#c7d7ef"/>

    <g fill="#ffffff" stroke="#d6dee8">
      <rect x="0" y="62" width="170" height="72"/><rect x="170" y="62" width="220" height="72"/><rect x="390" y="62" width="240" height="72"/><rect x="630" y="62" width="230" height="72"/><rect x="860" y="62" width="190" height="72"/>
      <rect x="0" y="134" width="170" height="72"/><rect x="170" y="134" width="220" height="72"/><rect x="390" y="134" width="240" height="72"/><rect x="630" y="134" width="230" height="72"/><rect x="860" y="134" width="190" height="72"/>
      <rect x="0" y="206" width="170" height="72"/><rect x="170" y="206" width="220" height="72"/><rect x="390" y="206" width="240" height="72"/><rect x="630" y="206" width="230" height="72"/><rect x="860" y="206" width="190" height="72"/>
    </g>

    <text x="85" y="36" text-anchor="middle" class="head">aggregationstillstånd</text>
    <text x="280" y="36" text-anchor="middle" class="head">avstånd mellan partiklarna</text>
    <text x="510" y="36" text-anchor="middle" class="head">partiklarnas rörelse</text>
    <text x="745" y="36" text-anchor="middle" class="head">krafter mellan partiklarna</text>
    <text x="955" y="36" text-anchor="middle" class="head">form</text>

    <g class="cell">
      <text x="85" y="104" text-anchor="middle">fast ämne</text>
      <text x="280" y="104" text-anchor="middle">tätt packade</text>
      <text x="955" y="104" text-anchor="middle">fast form</text>

      <text x="85" y="176" text-anchor="middle">flytande ämne</text>
      <text x="280" y="176" text-anchor="middle">tätt packade</text>
      <text x="510" y="176" text-anchor="middle">rör sig långsamt</text>
      <text x="510" y="198" text-anchor="middle">i alla riktningar</text>
      <text x="955" y="176" text-anchor="middle">behållarens form</text>

      <text x="85" y="248" text-anchor="middle">gas</text>
      <text x="745" y="248" text-anchor="middle">mycket svaga</text>
    </g>

    <g fill="none" stroke="#8fa1b3" stroke-width="2.5" stroke-dasharray="10 8">
      <rect x="418" y="82" width="184" height="34" rx="8"/>
      <rect x="658" y="82" width="174" height="34" rx="8"/>
      <rect x="886" y="82" width="138" height="34" rx="8"/>
      <rect x="658" y="154" width="174" height="34" rx="8"/>
      <rect x="198" y="226" width="164" height="34" rx="8"/>
      <rect x="418" y="226" width="184" height="34" rx="8"/>
      <rect x="886" y="226" width="138" height="34" rx="8"/>
    </g>

    <text x="510" y="104" text-anchor="middle" class="hint">svara här</text>
    <text x="745" y="104" text-anchor="middle" class="hint">svara här</text>
    <text x="955" y="104" text-anchor="middle" class="hint">svara här</text>
    <text x="745" y="176" text-anchor="middle" class="hint">svara här</text>
    <text x="280" y="248" text-anchor="middle" class="hint">svara här</text>
    <text x="510" y="248" text-anchor="middle" class="hint">svara här</text>
    <text x="955" y="248" text-anchor="middle" class="hint">svara här</text>
  </g>
</svg>
