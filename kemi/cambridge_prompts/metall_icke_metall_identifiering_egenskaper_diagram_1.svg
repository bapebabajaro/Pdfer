<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280">
  <defs>
    <style>
      .title { font: 700 26px Georgia, 'Times New Roman', serif; fill: #132238; }
      .body { font: 400 18px Arial, Helvetica, sans-serif; fill: #243648; }
    </style>
  </defs>
  <rect width="760" height="280" fill="#f6f8fb"/>
  <rect x="26" y="24" width="708" height="232" rx="22" fill="#ffffff" stroke="#d8e0ea" stroke-width="2"/>
  <text x="380" y="62" text-anchor="middle" class="title">Zakarias observationer</text>
  <g class="body">
    <text x="86" y="112">• När jag värmde ena änden av grundämnet blev andra änden snabbt varm.</text>
    <text x="86" y="156">• Grundämnet löste sig inte i vatten.</text>
    <text x="86" y="200">• Grundämnet är orange till färgen.</text>
  </g>
</svg>
