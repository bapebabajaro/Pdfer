<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360">
  <defs>
    <style>
      .title { font: 700 28px Georgia, 'Times New Roman', serif; fill: #132238; }
      .year { font: 700 17px Arial, Helvetica, sans-serif; fill: #173149; }
      .name { font: 400 17px Arial, Helvetica, sans-serif; fill: #243648; }
      .note { font: italic 16px Georgia, 'Times New Roman', serif; fill: #647587; }
    </style>
  </defs>
  <rect width="980" height="360" fill="#f6f8fb"/>
  <rect x="24" y="24" width="932" height="312" rx="24" fill="#ffffff" stroke="#d8e0ea" stroke-width="2"/>
  <text x="490" y="64" text-anchor="middle" class="title">Tidslinje över atommodellens historia</text>

  <line x1="90" y1="180" x2="890" y2="180" stroke="#26425f" stroke-width="5" stroke-linecap="round"/>

  <g stroke="#26425f" stroke-width="4">
    <line x1="110" y1="145" x2="110" y2="215"/>
    <line x1="250" y1="145" x2="250" y2="215"/>
    <line x1="390" y1="145" x2="390" y2="215"/>
    <line x1="530" y1="145" x2="530" y2="215"/>
    <line x1="670" y1="145" x2="670" y2="215"/>
    <line x1="820" y1="145" x2="820" y2="215"/>
  </g>

  <g text-anchor="middle">
    <text x="110" y="128" class="year">400 f.Kr.</text>
    <text x="110" y="242" class="name">Demokritos</text>

    <text x="250" y="128" class="year">1803</text>
    <text x="250" y="242" class="name">Dalton</text>

    <text x="390" y="128" class="year">1904</text>
    <text x="390" y="242" class="name">JJ Thomson</text>

    <text x="530" y="128" class="year">1910</text>
    <text x="530" y="242" class="name">Rutherford</text>

    <text x="670" y="128" class="year">1913</text>
    <text x="670" y="242" class="name">Bohr</text>

    <text x="820" y="128" class="year">1926</text>
    <text x="820" y="242" class="name">Schrödinger / Heisenberg</text>
  </g>

  <text x="490" y="296" text-anchor="middle" class="note">ej i skala</text>
</svg>
