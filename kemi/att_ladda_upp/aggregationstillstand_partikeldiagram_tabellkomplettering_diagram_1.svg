    <text x="736" y="114" text-anchor="middle" class="hint">svara här</text>
    <text x="295" y="186" text-anchor="middle" class="hint">svara här</text>
    <text x="520" y="258" text-anchor="middle" class="hint">svara här</text>
    <text x="736" y="258" text-anchor="middle" class="hint">svara här</text>
    <text x="520" y="330" text-anchor="middle" class="hint">svara här</text>
    <text x="736" y="330" text-anchor="middle" class="hint">svara här</text>
