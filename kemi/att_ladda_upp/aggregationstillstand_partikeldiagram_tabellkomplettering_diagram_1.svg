<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560">
  <defs>
    <style>
      .title { font: 700 28px Georgia, 'Times New Roman', serif; fill: #132238; }
      .subtitle { font: 400 16px Arial, Helvetica, sans-serif; fill: #556476; }
      .head { font: 700 20px Arial, Helvetica, sans-serif; fill: #132238; }
      .label { font: 700 18px Arial, Helvetica, sans-serif; fill: #223247; }
      .cell { font: 400 18px Arial, Helvetica, sans-serif; fill: #263647; }
      .hint { font: italic 15px Georgia, 'Times New Roman', serif; fill: #6c7a88; }
    </style>
  </defs>

  <rect width="980" height="560" fill="#f6f8fb"/>
  <rect x="28" y="28" width="924" height="504" rx="24" fill="#ffffff" stroke="#d8e0ea" stroke-width="2"/>

  <text x="490" y="78" text-anchor="middle" class="title">Egenskaper hos olika aggregationstillstånd</text>
  <text x="490" y="108" text-anchor="middle" class="subtitle">Fyll i de markerade rutorna med rätt egenskap.</text>

  <g transform="translate(74 146)">
    <rect x="0" y="0" width="190" height="72" rx="14" fill="#dfe7f0" stroke="#bcc8d4"/>
    <rect x="190" y="0" width="210" height="72" rx="14" fill="#d7efe8" stroke="#b4d9cb"/>
    <rect x="400" y="0" width="240" height="72" rx="14" fill="#e6eef9" stroke="#c7d7ef"/>
    <rect x="640" y="0" width="192" height="72" rx="14" fill="#f8ead3" stroke="#e8d0a2"/>

    <rect x="0" y="72" width="190" height="72" fill="#f5f7fa" stroke="#d6dee8"/>
    <rect x="190" y="72" width="210" height="72" fill="#ffffff" stroke="#d6dee8"/>
    <rect x="400" y="72" width="240" height="72" fill="#ffffff" stroke="#d6dee8"/>
    <rect x="640" y="72" width="192" height="72" fill="#ffffff" stroke="#d6dee8"/>

    <rect x="0" y="144" width="190" height="72" fill="#f5f7fa" stroke="#d6dee8"/>
    <rect x="190" y="144" width="210" height="72" fill="#ffffff" stroke="#d6dee8"/>
    <rect x="400" y="144" width="240" height="72" fill="#ffffff" stroke="#d6dee8"/>
    <rect x="640" y="144" width="192" height="72" fill="#ffffff" stroke="#d6dee8"/>

    <rect x="0" y="216" width="190" height="72" fill="#f5f7fa" stroke="#d6dee8"/>
    <rect x="190" y="216" width="210" height="72" fill="#ffffff" stroke="#d6dee8"/>
    <rect x="400" y="216" width="240" height="72" fill="#ffffff" stroke="#d6dee8"/>
    <rect x="640" y="216" width="192" height="72" fill="#ffffff" stroke="#d6dee8"/>

    <rect x="0" y="288" width="190" height="72" fill="#f5f7fa" stroke="#d6dee8"/>
    <rect x="190" y="288" width="210" height="72" fill="#ffffff" stroke="#d6dee8"/>
    <rect x="400" y="288" width="240" height="72" fill="#ffffff" stroke="#d6dee8"/>
    <rect x="640" y="288" width="192" height="72" fill="#ffffff" stroke="#d6dee8"/>

    <text x="95" y="43" text-anchor="middle" class="head">egenskap</text>
    <text x="295" y="43" text-anchor="middle" class="head">fast ämne</text>
    <text x="520" y="43" text-anchor="middle" class="head">flytande ämne</text>
    <text x="736" y="43" text-anchor="middle" class="head">gas</text>

    <text x="95" y="116" text-anchor="middle" class="label">form</text>
    <text x="295" y="116" text-anchor="middle" class="cell">fast form</text>
    <text x="520" y="116" text-anchor="middle" class="cell">behållarens form</text>

    <text x="95" y="188" text-anchor="middle" class="label">volym</text>
    <text x="520" y="188" text-anchor="middle" class="cell">fast volym</text>
    <text x="736" y="188" text-anchor="middle" class="cell">fyller hela</text>
    <text x="736" y="210" text-anchor="middle" class="cell">behållaren</text>

    <text x="95" y="260" text-anchor="middle" class="label">kan flöda?</text>
    <text x="295" y="260" text-anchor="middle" class="cell">nej</text>

    <text x="95" y="332" text-anchor="middle" class="label">komprimerbar?</text>
    <text x="295" y="332" text-anchor="middle" class="cell">bara lite</text>

    <g fill="none" stroke="#8fa1b3" stroke-width="2.5" stroke-dasharray="10 8">
      <rect x="662" y="89" width="148" height="38" rx="10"/>
      <rect x="222" y="161" width="146" height="38" rx="10"/>
      <rect x="422" y="233" width="196" height="38" rx="10"/>
      <rect x="662" y="233" width="148" height="38" rx="10"/>
