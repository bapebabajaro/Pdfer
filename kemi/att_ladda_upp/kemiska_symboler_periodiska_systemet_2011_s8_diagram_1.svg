<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440">
  <defs>
    <style>
      .title { font: 700 28px Georgia, 'Times New Roman', serif; fill: #132238; }
      .head { font: 700 20px Arial, Helvetica, sans-serif; fill: #173149; }
      .cell { font: 400 21px Arial, Helvetica, sans-serif; fill: #243648; }
      .note { font: 400 15px Arial, Helvetica, sans-serif; fill: #6a7885; }
    </style>
  </defs>
  <rect width="860" height="440" fill="#f6f8fb"/>
  <rect x="24" y="24" width="812" height="392" rx="24" fill="#ffffff" stroke="#d8e0ea" stroke-width="2"/>
  <text x="430" y="68" text-anchor="middle" class="title">Koppla grundämne till kemisk symbol</text>

  <g transform="translate(90 118)">
    <text x="110" y="-14" text-anchor="middle" class="head">grundämne</text>
    <text x="570" y="-14" text-anchor="middle" class="head">kemisk symbol</text>

    <g fill="#ffffff" stroke="#b9c7d5" stroke-width="2">
      <rect x="0" y="0" width="220" height="46" rx="10"/>
      <rect x="0" y="56" width="220" height="46" rx="10"/>
      <rect x="0" y="112" width="220" height="46" rx="10"/>
      <rect x="0" y="168" width="220" height="46" rx="10"/>
      <rect x="0" y="224" width="220" height="46" rx="10"/>

      <rect x="460" y="0" width="220" height="46" rx="10"/>
      <rect x="460" y="56" width="220" height="46" rx="10"/>
      <rect x="460" y="112" width="220" height="46" rx="10"/>
      <rect x="460" y="168" width="220" height="46" rx="10"/>
      <rect x="460" y="224" width="220" height="46" rx="10"/>
    </g>

    <g class="cell">
      <text x="110" y="30" text-anchor="middle">aluminium</text>
      <text x="110" y="86" text-anchor="middle">argon</text>
      <text x="110" y="142" text-anchor="middle">kalium</text>
      <text x="110" y="198" text-anchor="middle">kalcium</text>
      <text x="110" y="254" text-anchor="middle">kol</text>

      <text x="570" y="30" text-anchor="middle">K</text>
      <text x="570" y="86" text-anchor="middle">Ca</text>
      <text x="570" y="142" text-anchor="middle">C</text>
      <text x="570" y="198" text-anchor="middle">Ar</text>
      <text x="570" y="254" text-anchor="middle">Al</text>
    </g>

    <g stroke="#e1e6ec" stroke-width="2" stroke-dasharray="8 8">
      <line x1="238" y1="23" x2="442" y2="23"/>
      <line x1="238" y1="79" x2="442" y2="79"/>
      <line x1="238" y1="135" x2="442" y2="135"/>
      <line x1="238" y1="191" x2="442" y2="191"/>
      <line x1="238" y1="247" x2="442" y2="247"/>
    </g>

    <text x="340" y="320" text-anchor="middle" class="note">Dra streck mellan rätt par.</text>
  </g>
</svg>
