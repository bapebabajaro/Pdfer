<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" style="background:white;font-family:Arial,sans-serif;">
  <!-- Vit bakgrund -->
  <rect width="400" height="400" fill="white"/>
  
  <!-- Elektronskal (stor cirkel) -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="#333" stroke-width="2"/>
  
  <!-- Kärna (grå cirkel) -->
  <circle cx="200" cy="200" r="35" fill="#cccccc" stroke="#555" stroke-width="2"/>
  
  <!-- P och N inuti kärnan -->
  <circle cx="187" cy="193" r="12" fill="#ff6666" stroke="#aa0000" stroke-width="1"/>
  <text x="187" y="197" text-anchor="middle" font-size="12" font-weight="bold" fill="#700">P</text>
  <circle cx="213" cy="193" r="12" fill="#6699ff" stroke="#0033aa" stroke-width="1"/>
  <text x="213" y="197" text-anchor="middle" font-size="12" font-weight="bold" fill="#003">N</text>
  <circle cx="187" cy="213" r="12" fill="#ff6666" stroke="#aa0000" stroke-width="1"/>
  <text x="187" y="217" text-anchor="middle" font-size="12" font-weight="bold" fill="#700">P</text>
  <circle cx="213" cy="213" r="12" fill="#6699ff" stroke="#0033aa" stroke-width="1"/>
  <text x="213" y="217" text-anchor="middle" font-size="12" font-weight="bold" fill="#003">N</text>
  
  <!-- Elektroner på elektronskal -->
  <circle cx="200" cy="50" r="8" fill="#333" stroke="#000" stroke-width="1"/>
  <circle cx="200" cy="350" r="8" fill="#333" stroke="#000" stroke-width="1"/>
  
  <!-- Pil 1: från elektron (övre) → etikett uppe till höger -->
  <line x1="210" y1="55" x2="300" y2="30" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="305" y="28" font-size="14" fill="#000">.............................[elektron]</text>
  
  <!-- Pil 2: från kärna → etikett höger -->
  <line x1="235" y1="195" x2="320" y2="195" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="325" y="199" font-size="14" fill="#000">................[kärna]</text>
  
  <!-- Pil 3: från P (övre vänster) → etikett uppe till vänster -->
  <line x1="178" y1="182" x2="80" y2="120" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="5" y="118" font-size="14" fill="#000">[proton].....</text>
  
  <!-- Pil 4: från N (övre höger) → etikett nere till vänster -->
  <line x1="210" y1="218" x2="80" y2="290" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="5" y="293" font-size="14" fill="#000">[neutron]....</text>
  
  <!-- Pilmarkör -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#000"/>
    </marker>
  </defs>
</svg>