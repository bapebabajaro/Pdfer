<svg xmlns="http://www.w3.org/2000/svg" width="500" height="400" style="background:#fff;font-family:Arial,sans-serif;font-size:13px;">

  <!-- Termometer (Apparat X) -->
  <rect x="235" y="50" width="12" height="120" rx="4" fill="none" stroke="black" stroke-width="2"/>
  <line x1="247" y1="70" x2="255" y2="70" stroke="black" stroke-width="1"/>
  <line x1="247" y1="90" x2="255" y2="90" stroke="black" stroke-width="1"/>
  <line x1="247" y1="110" x2="255" y2="110" stroke="black" stroke-width="1"/>
  <line x1="247" y1="130" x2="255" y2="130" stroke="black" stroke-width="1"/>
  <rect x="237" y="120" width="8" height="50" rx="2" fill="#cc0000"/>
  <circle cx="241" cy="172" r="9" fill="#cc0000" stroke="black" stroke-width="2"/>
  <line x1="260" y1="80" x2="295" y2="65" stroke="black" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="297" y="68" font-size="13">Apparat X</text>

  <!-- Beaker -->
  <rect x="170" y="180" width="140" height="110" rx="4" fill="none" stroke="black" stroke-width="2.5"/>
  <polygon points="185,255 200,240 220,248 215,265 190,268" fill="#d0d0d0" stroke="#888" stroke-width="1"/>
  <polygon points="205,260 225,245 245,252 240,272 210,275" fill="#d0d0d0" stroke="#888" stroke-width="1"/>
  <polygon points="240,255 255,242 270,250 265,268 245,270" fill="#d0d0d0" stroke="#888" stroke-width="1"/>
  <polygon points="190,240 205,228 218,238 210,252 192,250" fill="#e0e0e0" stroke="#aaa" stroke-width="1"/>
  <polygon points="230,238 248,230 260,240 252,255 232,252" fill="#e0e0e0" stroke="#aaa" stroke-width="1"/>
  <text x="175" y="175" font-size="12" fill="#555">B&#228;garglas</text>
  <text x="193" y="288" font-size="12" fill="#444">Krossad is</text>

  <!-- Wire mesh -->
  <line x1="160" y1="300" x2="330" y2="300" stroke="black" stroke-width="2"/>
  <line x1="165" y1="300" x2="175" y2="310" stroke="black" stroke-width="1"/>
  <line x1="180" y1="300" x2="190" y2="310" stroke="black" stroke-width="1"/>
  <line x1="195" y1="300" x2="205" y2="310" stroke="black" stroke-width="1"/>
  <line x1="210" y1="300" x2="220" y2="310" stroke="black" stroke-width="1"/>
  <line x1="225" y1="300" x2="235" y2="310" stroke="black" stroke-width="1"/>
  <line x1="240" y1="300" x2="250" y2="310" stroke="black" stroke-width="1"/>
  <line x1="255" y1="300" x2="265" y2="310" stroke="black" stroke-width="1"/>
  <line x1="270" y1="300" x2="280" y2="310" stroke="black" stroke-width="1"/>
  <line x1="285" y1="300" x2="295" y2="310" stroke="black" stroke-width="1"/>
  <line x1="300" y1="300" x2="310" y2="310" stroke="black" stroke-width="1"/>
  <line x1="315" y1="300" x2="325" y2="310" stroke="black" stroke-width="1"/>
  <text x="335" y="304" font-size="12" fill="#555">Tr&#229;dn&#228;t</text>

  <!-- Trefot -->
  <line x1="245" y1="300" x2="200" y2="350" stroke="black" stroke-width="2"/>
  <line x1="245" y1="300" x2="245" y2="355" stroke="black" stroke-width="2"/>
  <line x1="245" y1="300" x2="290" y2="350" stroke="black" stroke-width="2"/>
  <text x="300" y="350" font-size="12" fill="#555">Trefot</text>

  <!-- Spritlykta -->
  <polygon points="225,355 265,355 245,335" fill="orange" stroke="#cc6600" stroke-width="1"/>
  <rect x="225" y="355" width="40" height="20" rx="3" fill="#ddd" stroke="#999" stroke-width="1.5"/>
  <text x="300" y="370" font-size="12" fill="#555">Spritlykta</text>

  <text x="225" y="398" font-size="13" font-weight="bold">V&#196;RME &#8593;</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="black"/>
    </marker>
  </defs>
</svg>