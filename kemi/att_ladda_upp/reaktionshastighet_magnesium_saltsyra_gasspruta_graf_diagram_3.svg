<svg xmlns="http://www.w3.org/2000/svg" width="820" height="560" viewBox="0 0 820 560">
  <defs>
    <style>
      .title { font: 700 26px Georgia, 'Times New Roman', serif; fill: #132238; }
      .body { font: 400 16px Arial, Helvetica, sans-serif; fill: #5a6978; }
      .axis { font: 700 20px Arial, Helvetica, sans-serif; fill: #132238; }
      .tick { font: 400 15px Arial, Helvetica, sans-serif; fill: #2d3b49; }
    </style>
  </defs>
  <rect width="820" height="560" fill="#f6f8fb"/>
  <rect x="24" y="24" width="772" height="512" rx="24" fill="#ffffff" stroke="#d8e0ea" stroke-width="2"/>
  <text x="410" y="62" text-anchor="middle" class="title">Gasvolym under reaktionen</text>
  <text x="410" y="88" text-anchor="middle" class="body">Kurvan planar ut när reaktionen är avslutad.</text>

  <g stroke="#dde4ec" stroke-width="1">
    <line x1="100" y1="430" x2="720" y2="430"/>
    <line x1="100" y1="380" x2="720" y2="380"/>
    <line x1="100" y1="330" x2="720" y2="330"/>
    <line x1="100" y1="280" x2="720" y2="280"/>
    <line x1="100" y1="230" x2="720" y2="230"/>
    <line x1="100" y1="180" x2="720" y2="180"/>
    <line x1="100" y1="130" x2="720" y2="130"/>
    <line x1="100" y1="80" x2="720" y2="80"/>

    <line x1="100" y1="80" x2="100" y2="430"/>
    <line x1="224" y1="80" x2="224" y2="430"/>
    <line x1="348" y1="80" x2="348" y2="430"/>
    <line x1="472" y1="80" x2="472" y2="430"/>
    <line x1="596" y1="80" x2="596" y2="430"/>
    <line x1="720" y1="80" x2="720" y2="430"/>
  </g>

  <g stroke="#1d1d1d" stroke-width="3">
    <line x1="100" y1="430" x2="735" y2="430"/>
    <line x1="100" y1="445" x2="100" y2="80"/>
  </g>

  <g class="tick">
    <text x="100" y="458" text-anchor="middle">0</text>
    <text x="224" y="458" text-anchor="middle">20</text>
    <text x="348" y="458" text-anchor="middle">40</text>
    <text x="472" y="458" text-anchor="middle">60</text>
    <text x="596" y="458" text-anchor="middle">80</text>
    <text x="720" y="458" text-anchor="middle">100</text>

    <text x="86" y="435" text-anchor="end">0</text>
    <text x="86" y="385" text-anchor="end">10</text>
    <text x="86" y="335" text-anchor="end">20</text>
    <text x="86" y="285" text-anchor="end">30</text>
    <text x="86" y="235" text-anchor="end">40</text>
    <text x="86" y="185" text-anchor="end">50</text>
    <text x="86" y="135" text-anchor="end">60</text>
    <text x="86" y="85" text-anchor="end">70</text>
  </g>

  <text x="410" y="506" text-anchor="middle" class="axis">tid / sekunder</text>
  <text x="34" y="262" text-anchor="middle" class="axis" transform="rotate(-90 34 262)">total gasvolym i sprutan / cm³</text>

  <polyline fill="none" stroke="#1a6fa7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"
    points="100,430 224,280 348,205 472,155 596,130 720,130"/>
  <g fill="#1a6fa7" stroke="#114863" stroke-width="2.5">
    <circle cx="100" cy="430" r="7"/>
    <circle cx="224" cy="280" r="7"/>
    <circle cx="348" cy="205" r="7"/>
    <circle cx="472" cy="155" r="7"/>
    <circle cx="596" cy="130" r="7"/>
    <circle cx="720" cy="130" r="7"/>
  </g>

  <line x1="642" y1="112" x2="596" y2="132" stroke="#444" stroke-width="2"/>
  <polygon points="596,132 606,125 607,136" fill="#444"/>
  <text x="648" y="108" class="body">reaktionen är avslutad</text>
</svg>
