<svg xmlns="http://www.w3.org/2000/svg" width="500" height="350" viewBox="0 0 500 350" style="background:white;font-family:Arial,sans-serif;">
  <!-- Vit bakgrund -->
  <rect width="500" height="350" fill="white"/>
  
  <!-- Guldblad (tunn vertikal linje) -->
  <rect x="245" y="20" width="10" height="310" fill="#FFD700" stroke="#B8860B" stroke-width="1"/>
  
  <!-- Etikett: guldblad -->
  <line x1="255" y1="60" x2="310" y2="45" stroke="#333" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="313" y="48" font-size="13" fill="#333">guldblad</text>
  
  <!-- Atomcentrum (X:en bakom guldblad) -->
  <text x="266" y="180" font-size="14" font-weight="bold" fill="#B8860B">X</text>
  <text x="266" y="210" font-size="14" font-weight="bold" fill="#B8860B">X</text>
  
  <!-- Pilmarkör -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1a1aff"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#cc0000"/>
    </marker>
  </defs>
  
  <!-- Genomgående partiklar (raka) -->
  <line x1="20" y1="80" x2="480" y2="80" stroke="#1a1aff" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="20" y1="120" x2="480" y2="120" stroke="#1a1aff" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="20" y1="160" x2="480" y2="160" stroke="#1a1aff" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="20" y1="200" x2="480" y2="200" stroke="#1a1aff" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="20" y1="240" x2="480" y2="240" stroke="#1a1aff" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="20" y1="280" x2="480" y2="280" stroke="#1a1aff" stroke-width="1.5" marker-end="url(#arr)"/>
  
  <!-- Kraftigt böjd partikel (spridd av kärnan) -->
  <polyline points="20,190 244,190 380,60" fill="none" stroke="#ff8800" stroke-width="2" marker-end="url(#arr)"/>
  
  <!-- Kraftigt böjd partikel 2 -->
  <polyline points="20,210 244,210 390,300" fill="none" stroke="#ff8800" stroke-width="2" marker-end="url(#arr)"/>
  
  <!-- Partikel som studsar tillbaka -->
  <polyline points="20,175 244,175 30,150" fill="none" stroke="#cc0000" stroke-width="2" marker-end="url(#arrB)"/>
  
  <!-- Etikett: de flesta genomgående -->
  <text x="20" y="15" font-size="12" fill="#1a1aff">De flesta partiklar går rakt igenom</text>
  
  <!-- Etikett: studsar tillbaka -->
  <text x="20" y="145" font-size="11" fill="#cc0000">↩ studsar tillbaka</text>
  
  <!-- Etikett: sprids -->
  <text x="360" y="55" font-size="11" fill="#ff8800">sprids</text>
</svg>