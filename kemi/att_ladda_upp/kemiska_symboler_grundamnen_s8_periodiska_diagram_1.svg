<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520">
  <defs>
    <style>
      .title { font: 700 28px Georgia, 'Times New Roman', serif; fill: #132238; }
      .head { font: 700 20px Arial, Helvetica, sans-serif; fill: #173149; }
      .cell { font: 400 21px Arial, Helvetica, sans-serif; fill: #243648; }
      .note { font: 400 15px Arial, Helvetica, sans-serif; fill: #6a7885; }
    </style>
  </defs>
  <rect width="920" height="520" fill="#f6f8fb"/>
  <rect x="24" y="24" width="872" height="472" rx="24" fill="#ffffff" stroke="#d8e0ea" stroke-width="2"/>
  <text x="460" y="68" text-anchor="middle" class="title">Koppla grundämne till kemisk beteckning</text>

  <g transform="translate(80 120)">
    <text x="120" y="-14" text-anchor="middle" class="head">grundämne</text>
    <text x="640" y="-14" text-anchor="middle" class="head">kemisk beteckning</text>

    <g fill="#ffffff" stroke="#b9c7d5" stroke-width="2">
      <rect x="0" y="0" width="240" height="46" rx="10"/>
      <rect x="0" y="56" width="240" height="46" rx="10"/>
      <rect x="0" y="112" width="240" height="46" rx="10"/>
      <rect x="0" y="168" width="240" height="46" rx="10"/>
      <rect x="0" y="224" width="240" height="46" rx="10"/>
      <rect x="0" y="280" width="240" height="46" rx="10"/>

      <rect x="520" y="0" width="240" height="46" rx="10"/>
      <rect x="520" y="42" width="240" height="46" rx="10"/>
      <rect x="520" y="84" width="240" height="46" rx="10"/>
      <rect x="520" y="126" width="240" height="46" rx="10"/>
      <rect x="520" y="168" width="240" height="46" rx="10"/>
      <rect x="520" y="210" width="240" height="46" rx="10"/>
      <rect x="520" y="252" width="240" height="46" rx="10"/>
      <rect x="520" y="294" width="240" height="46" rx="10"/>
    </g>

    <g class="cell">
      <text x="120" y="30" text-anchor="middle">kväve</text>
      <text x="120" y="86" text-anchor="middle">fosfor</text>
      <text x="120" y="142" text-anchor="middle">kalium</text>
      <text x="120" y="198" text-anchor="middle">kisel</text>
      <text x="120" y="254" text-anchor="middle">natrium</text>
      <text x="120" y="310" text-anchor="middle">svavel</text>

      <text x="640" y="30" text-anchor="middle">Ni</text>
      <text x="640" y="72" text-anchor="middle">P</text>
      <text x="640" y="114" text-anchor="middle">N</text>
      <text x="640" y="156" text-anchor="middle">Na</text>
      <text x="640" y="198" text-anchor="middle">Po</text>
      <text x="640" y="240" text-anchor="middle">S</text>
      <text x="640" y="282" text-anchor="middle">K</text>
      <text x="640" y="324" text-anchor="middle">Si</text>
    </g>

    <g stroke="#e1e6ec" stroke-width="2" stroke-dasharray="8 8">
      <line x1="260" y1="23" x2="500" y2="23"/>
      <line x1="260" y1="79" x2="500" y2="79"/>
      <line x1="260" y1="135" x2="500" y2="135"/>
      <line x1="260" y1="191" x2="500" y2="191"/>
      <line x1="260" y1="247" x2="500" y2="247"/>
      <line x1="260" y1="303" x2="500" y2="303"/>
    </g>

    <text x="380" y="368" text-anchor="middle" class="note">Dra streck i det tomma området mellan kolumnerna.</text>
  </g>
</svg>
