<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <defs>
    <style>
      .title { font: 700 28px Georgia, 'Times New Roman', serif; fill: #132238; }
      .label { font: 700 22px Arial, Helvetica, sans-serif; fill: #1f3043; }
      .hint { font: 400 16px Arial, Helvetica, sans-serif; fill: #6f7d89; }
      .note { font: italic 15px Georgia, 'Times New Roman', serif; fill: #788796; }
    </style>
  </defs>

  <rect width="900" height="420" fill="#f6f8fb"/>
  <rect x="24" y="24" width="852" height="372" rx="24" fill="#ffffff" stroke="#d8e0ea" stroke-width="2"/>

  <text x="450" y="64" text-anchor="middle" class="title">Rita partiklar i rutorna</text>

  <g transform="translate(70 104)">
    <text x="160" y="0" text-anchor="middle" class="label">fast ämne</text>
    <rect x="0" y="20" width="320" height="220" rx="18" fill="#fbfdff" stroke="#98abbe" stroke-width="2.5"/>
    <line x1="58" y1="74" x2="262" y2="74" stroke="#e0e7ef" stroke-width="1.5"/>
    <line x1="58" y1="129" x2="262" y2="129" stroke="#e0e7ef" stroke-width="1.5"/>
    <line x1="58" y1="184" x2="262" y2="184" stroke="#e0e7ef" stroke-width="1.5"/>
    <line x1="93" y1="46" x2="93" y2="212" stroke="#e0e7ef" stroke-width="1.5"/>
    <line x1="160" y1="46" x2="160" y2="212" stroke="#e0e7ef" stroke-width="1.5"/>
    <line x1="227" y1="46" x2="227" y2="212" stroke="#e0e7ef" stroke-width="1.5"/>
    <text x="160" y="270" text-anchor="middle" class="hint">Täta partiklar i ordnat mönster</text>
    <text x="160" y="294" text-anchor="middle" class="note">Eleven fyller själv i cirklarna</text>
  </g>

  <g transform="translate(510 104)">
    <text x="160" y="0" text-anchor="middle" class="label">gas</text>
    <rect x="0" y="20" width="320" height="220" rx="18" fill="#fbfdff" stroke="#98abbe" stroke-width="2.5"/>
    <circle cx="84" cy="72" r="8" fill="none" stroke="#d2dce6" stroke-width="2"/>
    <circle cx="246" cy="88" r="8" fill="none" stroke="#d2dce6" stroke-width="2"/>
    <circle cx="155" cy="138" r="8" fill="none" stroke="#d2dce6" stroke-width="2"/>
    <circle cx="267" cy="178" r="8" fill="none" stroke="#d2dce6" stroke-width="2"/>
    <circle cx="96" cy="192" r="8" fill="none" stroke="#d2dce6" stroke-width="2"/>
    <text x="160" y="270" text-anchor="middle" class="hint">Glest spridda partiklar</text>
    <text x="160" y="294" text-anchor="middle" class="note">De bleka cirklarna visar bara förslag till placering</text>
  </g>
</svg>
