<svg xmlns="http://www.w3.org/2000/svg" width="720" height="180" font-family="Arial, sans-serif" font-size="13">
  <!-- Header row -->
  <rect x="0" y="0" width="144" height="40" fill="#cccccc" stroke="#000" stroke-width="1"/>
  <rect x="144" y="0" width="144" height="40" fill="#cccccc" stroke="#000" stroke-width="1"/>
  <rect x="288" y="0" width="144" height="40" fill="#cccccc" stroke="#000" stroke-width="1"/>
  <rect x="432" y="0" width="144" height="40" fill="#cccccc" stroke="#000" stroke-width="1"/>
  <rect x="576" y="0" width="144" height="40" fill="#cccccc" stroke="#000" stroke-width="1"/>
  <text x="72" y="26" text-anchor="middle" font-weight="bold">aggregationstillstånd</text>
  <text x="216" y="20" text-anchor="middle" font-weight="bold">avstånd mellan</text>
  <text x="216" y="34" text-anchor="middle" font-weight="bold">partiklarna</text>
  <text x="360" y="20" text-anchor="middle" font-weight="bold">partiklarnas</text>
  <text x="360" y="34" text-anchor="middle" font-weight="bold">rörelse</text>
  <text x="504" y="20" text-anchor="middle" font-weight="bold">krafter mellan</text>
  <text x="504" y="34" text-anchor="middle" font-weight="bold">partiklarna</text>
  <text x="648" y="26" text-anchor="middle" font-weight="bold">form</text>
  <!-- Row 2: Fast amne -->
  <rect x="0" y="40" width="144" height="46" fill="#fff" stroke="#000" stroke-width="1"/>
  <rect x="144" y="40" width="144" height="46" fill="#fff" stroke="#000" stroke-width="1"/>
  <rect x="288" y="40" width="144" height="46" fill="#fffbe6" stroke="#aaaaaa" stroke-width="1" stroke-dasharray="5,3"/>
  <rect x="432" y="40" width="144" height="46" fill="#fffbe6" stroke="#aaaaaa" stroke-width="1" stroke-dasharray="5,3"/>
  <rect x="576" y="40" width="144" height="46" fill="#fff" stroke="#000" stroke-width="1"/>
  <text x="72" y="68" text-anchor="middle">fast ämne</text>
  <text x="216" y="68" text-anchor="middle">tätt packade</text>
  <text x="360" y="68" text-anchor="middle" fill="#aaaaaa" font-style="italic">...............[1]</text>
  <text x="504" y="68" text-anchor="middle" fill="#aaaaaa" font-style="italic">...............[1]</text>
  <text x="648" y="68" text-anchor="middle">fast form</text>
  <!-- Row 3: Flytande amne -->
  <rect x="0" y="86" width="144" height="46" fill="#fff" stroke="#000" stroke-width="1"/>
  <rect x="144" y="86" width="144" height="46" fill="#fff" stroke="#000" stroke-width="1"/>
  <rect x="288" y="86" width="144" height="46" fill="#fff" stroke="#000" stroke-width="1"/>
  <rect x="432" y="86" width="144" height="46" fill="#fffbe6" stroke="#aaaaaa" stroke-width="1" stroke-dasharray="5,3"/>
  <rect x="576" y="86" width="144" height="46" fill="#fff" stroke="#000" stroke-width="1"/>
  <text x="72" y="114" text-anchor="middle">flytande ämne</text>
  <text x="216" y="114" text-anchor="middle">tätt packade</text>
  <text x="360" y="107" text-anchor="middle">rör sig långsamt</text>
  <text x="360" y="121" text-anchor="middle">i alla riktningar</text>
  <text x="504" y="114" text-anchor="middle" fill="#aaaaaa" font-style="italic">...............[1]</text>
  <text x="648" y="107" text-anchor="middle">behållarens</text>
  <text x="648" y="121" text-anchor="middle">form</text>
  <!-- Row 4: Gas -->
  <rect x="0" y="132" width="144" height="46" fill="#fff" stroke="#000" stroke-width="1"/>
  <rect x="144" y="132" width="144" height="46" fill="#fffbe6" stroke="#aaaaaa" stroke-width="1" stroke-dasharray="5,3"/>
  <rect x="288" y="132" width="144" height="46" fill="#fff" stroke="#000" stroke-width="1"/>
  <rect x="432" y="132" width="144" height="46" fill="#fff" stroke="#000" stroke-width="1"/>
  <rect x="576" y="132" width="144" height="46" fill="#fffbe6" stroke="#aaaaaa" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="72" y="160" text-anchor="middle">gas</text>
  <text x="216" y="160" text-anchor="middle" fill="#aaaaaa" font-style="italic">...............[1]</text>
  <text x="360" y="153" text-anchor="middle">rör sig snabbt</text>
  <text x="360" y="167" text-anchor="middle">i alla riktningar</text>
  <text x="504" y="160" text-anchor="middle">mycket svaga</text>
  <text x="648" y="160" text-anchor="middle" fill="#aaaaaa" font-style="italic">...............[1]</text>
</svg>