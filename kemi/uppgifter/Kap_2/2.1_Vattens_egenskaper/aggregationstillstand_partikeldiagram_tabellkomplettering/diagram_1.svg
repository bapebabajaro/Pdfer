  <rect x="450" y="34" width="150" height="34" fill="#fffbe6" stroke="#aaaaaa" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="525" y="51" text-anchor="middle" font-size="11" fill="#555">fyller hela</text>
  <text x="525" y="64" text-anchor="middle" font-size="11" fill="#555">beh&#229;llaren</text>

  <!-- Row 3: volym -->
