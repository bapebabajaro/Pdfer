  <!-- Row 4: kan floda? -->
  <rect x="0" y="102" width="150" height="34" fill="#fff" stroke="#000" stroke-width="1"/>
  <text x="75" y="125" text-anchor="middle" font-size="12">kan fl&#246;da?</text>
  <rect x="150" y="102" width="150" height="34" fill="#fff" stroke="#000" stroke-width="1"/>
  <text x="225" y="125" text-anchor="middle" font-size="12">nej</text>
  <rect x="300" y="102" width="150" height="34" fill="#fffbe6" stroke="#aaaaaa" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="375" y="125" text-anchor="middle" font-size="11" fill="#555">ja</text>
  <rect x="450" y="102" width="150" height="34" fill="#fffbe6" stroke="#aaaaaa" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="525" y="125" text-anchor="middle" font-size="11" fill="#555">ja</text>

  <!-- Row 5: komprimerbar? -->
  <rect x="0" y="136" width="150" height="34" fill="#fff" stroke="#000" stroke-width="1"/>
  <text x="75" y="147" text-anchor="middle" font-size="12">komprimerbar?</text>
  <text x="75" y="162" text-anchor="middle" font-size="10">(kan tryckas ihop)</text>
  <rect x="150" y="136" width="150" height="34" fill="#fff" stroke="#000" stroke-width="1"/>
  <text x="225" y="159" text-anchor="middle" font-size="12">bara lite</text>
